[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crustify-oracle"
version = "0.1.0"
description = "Deterministic semantic analysis and campaign scheduling for C codebases"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crustify-oracle = "crustify_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crustify_oracle*", "compose*"]

[tool.setuptools.data-files]
"share/crustify-oracle" = ["qlpack.yml", "codeql-pack.lock.yml", "identity.qll"]
"share/crustify-oracle/entities" = ["entities/*.ql"]
"share/crustify-oracle/edges" = ["edges/*.ql"]
"share/crustify-oracle/scratch" = ["scratch/*.ql"]
"share/crustify-oracle/schemas" = ["docs/schemas/*.md"]
