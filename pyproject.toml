[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefront"
version = "0.1.0"
description = "Deterministic semantic analysis and wave scheduling for C codebases"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wavefront = "wavefront.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wavefront*", "compose*"]

[tool.setuptools.data-files]
"share/wavefront" = ["src/qlpack.yml", "src/codeql-pack.lock.yml", "src/identity.qll"]
"share/wavefront/entities" = ["src/entities/*.ql"]
"share/wavefront/edges" = ["src/edges/*.ql"]
"share/wavefront/scratch" = ["src/scratch/*.ql"]
"share/wavefront/schemas" = ["docs/schemas/*.md"]
